<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon compte · Maison Fleur</title>
<meta name="description" content="Connexion à ton compte Maison Fleur.">
<meta name="theme-color" content="#B02A4E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23B02A4E'/%3E%3Ctext x='16' y='23' font-size='18' font-family='Georgia' fill='%23FDF8F4' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="wrap" style="max-width:440px;padding:48px 20px 80px;text-align:center">
    <p class="eyebrow">Mon compte</p>
    <h1 class="h-section">Re-bonjour <span class="italic">toi</span>.</h1>
    <p class="lede" style="margin:12px auto 26px">Connecte-toi pour suivre tes commandes et retrouver tes parfums préférés.</p>
    <form data-newsletter style="display:grid;gap:10px;text-align:left">
      <label class="tiny" for="ac-mail">E-mail</label>
      <input id="ac-mail" type="email" required placeholder="ton@email.com" style="height:52px;border:1px solid var(--line);border-radius:99px;padding:0 20px;background:#fff">
      <label class="tiny" for="ac-pass" style="margin-top:6px">Mot de passe</label>
      <input id="ac-pass" type="password" required placeholder="••••••••" style="height:52px;border:1px solid var(--line);border-radius:99px;padding:0 20px;background:#fff">
      <button class="btn btn-dark btn-block" type="submit" style="margin-top:10px">Se connecter</button>
      <a class="btn btn-ghost btn-block btn-sm" href="boutique.html">Créer un compte</a>
    </form>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>

</body>
</html>
